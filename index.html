<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="개인 가계부 - 수입과 지출을 간단하게 기록하세요." />
    <title>오늘의 가계부</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">HOUSEHOLD BUDGET</p>
          <h1>오늘의 가계부</h1>
        </div>
        <span class="privacy-badge">● 내 기기에만 저장</span>
      </header>

      <section class="intro-card" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">이번 달의 흐름</p>
          <h2 id="intro-title">돈의 흐름을 한눈에 정리해요.</h2>
          <p class="muted">작은 기록이 쌓이면 다음 달의 선택이 더 쉬워집니다.</p>
        </div>
        <label class="month-picker">
          <span>조회 월</span>
          <input id="month-filter" type="month" />
        </label>
      </section>

      <section class="summary-grid" aria-label="월별 요약">
        <article class="summary-card income-card">
          <span>수입</span>
          <strong id="income-total">₩0</strong>
        </article>
        <article class="summary-card expense-card">
          <span>지출</span>
          <strong id="expense-total">₩0</strong>
        </article>
        <article class="summary-card balance-card">
          <span>잔액</span>
          <strong id="balance-total">₩0</strong>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel form-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">QUICK ENTRY</p>
              <h2>내역 추가</h2>
            </div>
          </div>
          <form id="transaction-form">
            <div class="segmented-control" role="group" aria-label="내역 종류">
              <label>
                <input type="radio" name="type" value="expense" checked />
                <span>지출</span>
              </label>
              <label>
                <input type="radio" name="type" value="income" />
                <span>수입</span>
              </label>
            </div>
            <label class="field">
              <span>금액</span>
              <input id="amount" name="amount" type="number" min="1" step="100" placeholder="0" required />
            </label>
            <div class="field-row">
              <label class="field">
                <span>날짜</span>
                <input id="date" name="date" type="date" required />
              </label>
              <label class="field">
                <span>카테고리</span>
                <select id="category" name="category"></select>
              </label>
            </div>
            <label class="field">
              <span>메모 <small>(선택)</small></span>
              <input id="memo" name="memo" type="text" maxlength="80" placeholder="예: 점심 식사" />
            </label>
            <button class="primary-button" type="submit">내역 저장하기</button>
          </form>
        </article>

        <article class="panel list-panel">
          <div class="panel-heading list-heading">
            <div>
              <p class="eyebrow">TRANSACTIONS</p>
              <h2>최근 내역</h2>
            </div>
            <span id="transaction-count" class="count-badge">0건</span>
          </div>
          <div id="transaction-list" class="transaction-list" aria-live="polite"></div>
        </article>
      </section>
    </main>
    <script src="src/app.js" defer></script>
  </body>
</html>
